name: Reproducibility checks
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  verify-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify release file integrity
        run: python scripts/verify_repository.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real-data demo
        run: python run_all.py --demo --output-dir run_outputs/ci-demo
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-demo-report
          path: |
            run_outputs/ci-demo/run_report.json
            run_outputs/ci-demo/logs/
